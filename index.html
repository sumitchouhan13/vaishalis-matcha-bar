                btn.classList.add('is-pressed');
            }, { passive: true });

            const clearPress = () => btn.classList.remove('is-pressed');
            btn.addEventListener('touchend', clearPress, { passive: true });
            btn.addEventListener('touchcancel', clearPress, { passive: true });
        });

        // Allow Escape key to close modal when testing on desktop
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeMeme();
        });
    </script>
